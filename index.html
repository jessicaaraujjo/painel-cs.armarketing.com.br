<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de CS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: lista de carteira em tabela; clicar na linha abre a ficha em painel lateral; clicar na flag abre menu de edição. */
:root {
  --bg: #F7F5F6; --surface: #FFFFFF; --surface-2: #F3EFF1; --line: #E6DEE2;
  --fg: #1E1520; --muted: #6F6370;
  --accent: #8B174B; --accent-d: #4A1944; --accent-soft: #F8E6EE; --on-accent: #FFFFFF;
  --ok-bg: #DCFCE7; --ok-fg: #14532D; --ok-dot: #16A34A;
  --warn-bg: #FEF3C7; --warn-fg: #78350F; --warn-dot: #F59E0B;
  --bad-bg: #FEE2E2; --bad-fg: #7F1D1D; --bad-dot: #DC2626;
  --neu-bg: #E8E5E9; --neu-fg: #3B3340; --neu-dot: #9A909B;
  --vio-bg: #EDE9FE; --vio-fg: #4C1D95; --blu-bg: #DBEAFE; --blu-fg: #1E3A8A;
  --crit-row: #FDF4F6; --shadow: 0 12px 32px rgba(40, 10, 30, .18);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150C16; --surface: #1F1521; --surface-2: #2A1D2D; --line: #3A2B3D;
    --fg: #F4ECF3; --muted: #A596A8;
    --accent: #D0568F; --accent-d: #E7A1C3; --accent-soft: #3A1B2E; --on-accent: #1A0A14;
    --ok-bg: #12351F; --ok-fg: #A7F3C0; --warn-bg: #40300C; --warn-fg: #FDE68A; --bad-bg: #47161A; --bad-fg: #FECACA;
    --neu-bg: #332A36; --neu-fg: #D8CEDB; --vio-bg: #2E2150; --vio-fg: #D9CCFF; --blu-bg: #17284D; --blu-fg: #BFD6FF;
    --crit-row: #2A151D; --shadow: 0 12px 32px rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150C16; --surface: #1F1521; --surface-2: #2A1D2D; --line: #3A2B3D;
  --fg: #F4ECF3; --muted: #A596A8;
  --accent: #D0568F; --accent-d: #E7A1C3; --accent-soft: #3A1B2E; --on-accent: #1A0A14;
  --ok-bg: #12351F; --ok-fg: #A7F3C0; --warn-bg: #40300C; --warn-fg: #FDE68A; --bad-bg: #47161A; --bad-fg: #FECACA;
  --neu-bg: #332A36; --neu-fg: #D8CEDB; --vio-bg: #2E2150; --vio-fg: #D9CCFF; --blu-bg: #17284D; --blu-fg: #BFD6FF;
  --crit-row: #2A151D; --shadow: 0 12px 32px rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
header.top img { width: 30px; height: auto; }
header.top h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
header.top .tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 99px; }
.hint { display: flex; gap: 8px 18px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.hint b { color: var(--fg); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 14px 10px; }
.toolbar h2 { font-size: 14px; margin: 0 10px 0 0; font-weight: 800; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-d); }
.fchip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.bar { display: flex; height: 6px; margin: 0 14px 12px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.bar span { display: block; transition: width .25s; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 12px; background: var(--surface-2); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.crit { background: var(--crit-row); }
tbody tr.sel { background: var(--accent-soft); }
td:first-child { box-shadow: inset 4px 0 0 var(--stripe, transparent); }
.who { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.av { width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex: none; border: 2px solid var(--surface); }
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.stack .av + .av { margin-left: -7px; }
.nm { font-weight: 700; display: block; }
.sub { font-size: 11.5px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 99px; padding: 4px 8px 4px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; }
.chip .c { width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4.5px solid currentColor; opacity: .55; margin-left: 2px; }
.chip:hover { filter: brightness(.96); box-shadow: 0 0 0 2px var(--line); }
.ok { background: var(--ok-bg); color: var(--ok-fg); } .ok .d { background: var(--ok-dot); }
.warn { background: var(--warn-bg); color: var(--warn-fg); } .warn .d { background: var(--warn-dot); }
.bad { background: var(--bad-bg); color: var(--bad-fg); } .bad .d { background: var(--bad-dot); }
.neu { background: var(--neu-bg); color: var(--neu-fg); } .neu .d { background: var(--neu-dot); }
.respbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 3px 6px 3px 2px; border-radius: 99px; }
.respbtn:hover { box-shadow: 0 0 0 2px var(--line); }
.respbtn .cc { width: 0; height: 0; border-left: 3.5px solid transparent; border-right: 3.5px solid transparent; border-top: 4.5px solid var(--muted); opacity: .8; }
.acao { max-width: 220px; }
.due { font-size: 11.5px; color: var(--muted); }
.due.today { color: var(--warn-fg); font-weight: 700; }
.due.late { color: var(--bad-fg); font-weight: 700; }
/* popover */
.pop { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: 236px; padding: 6px; }
.pop h4 { margin: 4px 8px 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.pop .opt { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 7px 8px; border-radius: 7px; text-align: left; font-weight: 600; }
.pop .opt:hover { background: var(--surface-2); }
.pop .opt .d { width: 8px; height: 8px; border-radius: 50%; }
.pop .opt .ck { margin-left: auto; color: var(--muted); font-size: 12px; }
.pop .why { padding: 4px 6px 6px; display: grid; gap: 8px; }
.pop .why label { font-size: 12px; color: var(--muted); }
.pop textarea, .composer textarea, .composer input, .why input { width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.pop textarea { min-height: 62px; resize: vertical; }
.row-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; font-weight: 700; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(20, 5, 15, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 50; display: flex; flex-direction: column; transform: translateX(104%); transition: transform .24s ease; padding-top: env(safe-area-inset-top, 0px); }
.drawer.on { transform: none; }
.dh { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; }
.dh .av { width: 40px; height: 40px; font-size: 15px; }
.dh h3 { margin: 0; font-size: 17px; font-weight: 800; }
.dh .x { margin-left: auto; border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; }
.strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; padding: 4px 18px 10px; }
.strip label { display: block; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.editnote { padding: 0 18px 10px; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 8px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--accent-d); border-bottom-color: var(--accent); }
.tab .n { background: var(--accent); color: var(--on-accent); border-radius: 99px; font-size: 10.5px; padding: 1px 6px; margin-left: 4px; }
.dbody { flex: 1; overflow-y: auto; padding: 14px 18px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
.composer { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.composer textarea { min-height: 76px; resize: vertical; }
.types { display: flex; gap: 6px; flex-wrap: wrap; }
.type { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: 12px; font-weight: 600; }
.type[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 8px; }
.composer .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer .foot .hintx { font-size: 12px; color: var(--muted); flex: 1 1 160px; min-width: 0; }
.tl-head { display: flex; align-items: baseline; justify-content: space-between; }
.tl-head h4 { margin: 0; font-size: 14px; font-weight: 800; }
.tl-head span { font-size: 12px; color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.note { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.note .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.note .meta b { color: var(--fg); font-size: 12.5px; }
.note p { margin: 4px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.tag.alert { background: var(--bad-bg); color: var(--bad-fg); }
.tag.meet { background: var(--blu-bg); color: var(--blu-fg); }
.tag.call { background: var(--neu-bg); color: var(--neu-fg); }
.tag.dec { background: var(--ok-bg); color: var(--ok-fg); }
.tag.int { background: var(--warn-bg); color: var(--warn-fg); }
.tag.pin { background: var(--vio-bg); color: var(--vio-fg); }
.pinbtn { margin-left: auto; border: 0; background: none; font-size: 12px; color: var(--muted); text-decoration: underline; padding: 0; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hist li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; }
.hist li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.hist small { color: var(--muted); display: block; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: 12.5px; } .kv dd { margin: 0; font-weight: 600; }
.alert-hint { background: var(--bad-bg); color: var(--bad-fg); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.alert-hint button { margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-weight: 600; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 80; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 520px) { .strip { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>

    if (diff === 0) return '<span class="due today">Hoje</span>';
    if (diff < 0) return '<span class="due late">Atrasada · ' + fd(d) + '</span>';
    return '<span class="due">' + fd(d) + '</span>';
  }
  function chipBtn(c, field) {
    var v = c[field];
    return '<button type="button" class="chip ' + kind(field, v) + '" data-picker="' + field + '" data-id="' + c.id + '" aria-haspopup="listbox" aria-label="' + OPTS[field].label + ': ' + v + '. Alterar"><span class="d"></span>' + v + '<span class="c"></span></button>';
  }
  function avs(list, cls) { return list.map(function (a, i) { return '<span class="av ' + (cls || "") + '" style="background:' + AVC[(a.charCodeAt(0) + i) % 5] + '">' + a + '</span>'; }).join(""); }
  function respBtn(c) {
    return '<button type="button" class="respbtn" data-picker="resp" data-id="' + c.id + '" aria-haspopup="listbox" aria-label="Responsável CS: ' + c.resp.join(", ") + '. Alterar"><span class="stack">' + avs(c.resp, "sm") + '</span><span class="cc"></span></button>';
  }
  function respPopHtml(c) {
    return '<h4>Responsáveis do CS</h4>' + TEAM.map(function (m) {
      return '<button type="button" class="opt" data-resp="' + m[0] + '" role="option" aria-selected="' + (c.resp.indexOf(m[0]) > -1) + '"><span class="av sm" style="background:' + AVC[m[0].charCodeAt(0) % 5] + '">' + m[0] + '</span>' + m[1] + '<span class="ck">' + (c.resp.indexOf(m[0]) > -1 ? "✓" : "") + '</span></button>';
    }).join("") + '<p class="sub" style="margin:6px 8px 4px">O primeiro da lista é o responsável principal.</p>';
  }
  var STRIPE = { ok: "var(--ok-dot)", warn: "var(--warn-dot)", bad: "var(--bad-dot)" };

  function renderList() {
    var cnt = { Controlado: 0, "Atenção": 0, "Crítico": 0 };
    clients.forEach(function (c) { cnt[c.saude]++; });
    var tb = [["Todos", clients.length, null], ["Controlado", cnt.Controlado, "var(--ok-dot)"], ["Atenção", cnt["Atenção"], "var(--warn-dot)"], ["Crítico", cnt["Crítico"], "var(--bad-dot)"]];
    $("toolbar").innerHTML = '<h2>Carteira de clientes</h2>' + tb.map(function (t) {
      return '<button type="button" class="fchip" data-filter="' + t[0] + '" aria-pressed="' + (filter === t[0]) + '">' + (t[2] ? '<i style="background:' + t[2] + '"></i>' : "") + t[0] + " " + t[1] + "</button>";
    }).join("");
    var tot = clients.length || 1;
    $("bar").innerHTML = '<span style="width:' + cnt.Controlado / tot * 100 + '%;background:var(--ok-dot)"></span><span style="width:' + cnt["Atenção"] / tot * 100 + '%;background:var(--warn-dot)"></span><span style="width:' + cnt["Crítico"] / tot * 100 + '%;background:var(--bad-dot)"></span>';
    $("rows").innerHTML = clients.filter(function (c) { return filter === "Todos" || c.saude === filter; }).map(function (c) {
      var k = kind("saude", c.saude);
      return '<tr tabindex="0" data-row="' + c.id + '" class="' + (k === "bad" ? "crit " : "") + (openId === c.id ? "sel" : "") + '">' +
        '<td style="--stripe:' + STRIPE[k] + '"><div class="who"><span class="av" style="background:' + AVC[clients.indexOf(c) % 5] + '">' + c.name[0] + '</span><span><span class="nm">' + esc(c.name) + '</span><span class="sub">ID ' + c.id + ' · ' + c.seg + '</span></span></div></td>' +
        '<td>' + chipBtn(c, "saude") + '</td><td>' + chipBtn(c, "resultado") + '</td><td>' + chipBtn(c, "relac") + '</td><td>' + chipBtn(c, "fin") + '</td>' +
        '<td class="acao">' + esc(c.acao) + '<br>' + dueHtml(c.prazo) + '</td><td>' + respBtn(c) + '</td></tr>';
    }).join("");
  }

  /* ---------- drawer ---------- */
  function renderStrip(c) {
    return ["saude", "resultado", "relac", "fin"].map(function (f) { return '<div><label>' + OPTS[f].label + '</label>' + chipBtn(c, f) + '</div>'; }).join("") + '<div><label>Responsável CS</label>' + respBtn(c) + '</div>';
  }
  function lastContact(c) { var m = 0; c.notes.forEach(function (n) { if (+n.when > m) m = +n.when; }); return m ? fd(new Date(m)) : "—"; }
  function renderDrawer() {
    var c = byId(openId); if (!c) return;
    var d = $("drawer");
    d.innerHTML =
      '<div class="dh"><span class="av" style="background:' + AVC[clients.indexOf(c) % 5] + '">' + c.name[0] + '</span><div><h3>' + esc(c.name) + '</h3><span class="sub" id="dsub">ID ' + c.id + ' · ' + c.seg + ' · CS responsável: ' + c.resp.join(", ") + '</span></div><button class="x" type="button" id="close" aria-label="Fechar ficha">×</button></div>' +
      '<div class="strip" id="strip">' + renderStrip(c) + '</div>' +
      '<div class="editnote">Editável pelo CS. Cada alteração registra autor, data e valor anterior no Histórico.</div>' +
      '<div class="tabs" role="tablist">' +
      [["resumo", "Resumo", ""], ["notas", "Anotações", '<span class="n">' + c.notes.length + '</span>'], ["hist", "Histórico", ""]].map(function (t) { return '<button class="tab" role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '">' + t[1] + t[2] + '</button>'; }).join("") +
      '</div><div class="dbody" id="dbody"></div>';
    renderBody();
  }
  function renderBody() {
    var c = byId(openId); if (!c) return; var b = $("dbody"); if (!b) return;
    if (tab === "resumo") {
      b.innerHTML = '<dl class="kv"><dt>Segmento</dt><dd>' + c.seg + '</dd><dt>Responsáveis CS</dt><dd><span class="stack">' + avs(c.resp, "sm") + '</span></dd><dt>Último contato</dt><dd>' + lastContact(c) + '</dd><dt>Próxima ação</dt><dd>' + esc(c.acao) + '</dd><dt>Prazo</dt><dd>' + dueHtml(c.prazo) + '</dd><dt>Anotações</dt><dd>' + c.notes.length + '</dd></dl>';
    } else if (tab === "hist") {
      b.innerHTML = c.hist.length ? '<ul class="hist">' + c.hist.map(function (h) { return '<li><div>' + h.text + '<small>' + h.who + ' · ' + fw(h.when) + '</small></div></li>'; }).join("") + '</ul>' :
        '<p class="sub">Nenhuma alteração registrada ainda. Mude uma flag para ver o histórico aparecer aqui.</p>';
    } else {
      var sorted = c.notes.slice().sort(function (a, b) { return (b.pinned - a.pinned) || (b.when - a.when); });
      b.innerHTML =
        '<div class="composer"><div class="types" id="types">' + TYPES.map(function (t) { return '<button type="button" class="type" data-type="' + t[0] + '" aria-pressed="' + (draft.tipo === t[0]) + '">' + t[0] + '</button>'; }).join("") + '</div>' +
        '<textarea id="ntext" placeholder="Escreva uma anotação sobre este cliente..." aria-label="Texto da anotação">' + esc(draft.text) + '</textarea>' +
        '<div class="two"><input id="nacao" type="text" placeholder="Próxima ação (opcional)" aria-label="Próxima ação" value="' + esc(draft.acao) + '"><input id="nprazo" type="date" aria-label="Prazo" value="' + esc(draft.prazo) + '"></div>' +
        '<div class="foot"><span class="hintx">Salvar atualiza o último contato e, se preenchida, a próxima ação.</span><button type="button" class="btn primary" id="nsave"' + (draft.text.trim() ? "" : " disabled") + '>Salvar anotação</button></div></div>' +
        '<div class="tl-head"><h4>Anotações</h4><span>Fixadas e mais recentes primeiro</span></div>' +
        '<ul class="notes">' + sorted.map(function (n) {
          var ty = TYPES.filter(function (t) { return t[0] === n.tipo; })[0] || TYPES[1];
          return '<li class="note"><span class="av sm" style="background:' + AVC[n.au.charCodeAt(0) % 5] + '">' + n.au + '</span><div><div class="meta"><b>' + n.au + '</b><span>' + fw(n.when) + '</span><span class="tag ' + ty[1] + '">' + n.tipo + '</span>' + (n.pinned ? '<span class="tag pin">Fixada</span>' : "") + '<button type="button" class="pinbtn" data-pin="' + n.id + '">' + (n.pinned ? "Desafixar" : "Fixar") + '</button></div><p>' + esc(n.text) + '</p></div></li>';
        }).join("") + '</ul>';
    }
  }
  function openDrawer(id) {
    openId = id; tab = "notas"; draft = { tipo: "Reunião ou ligação", text: "", acao: "", prazo: "" };
    renderDrawer(); renderList();
    $("drawer").classList.add("on"); $("drawer").setAttribute("aria-hidden", "false"); $("scrim").classList.add("on");
    var x = $("close"); if (x) x.focus();
  }
  function closeDrawer() {
    openId = null; $("drawer").classList.remove("on"); $("drawer").setAttribute("aria-hidden", "true"); $("scrim").classList.remove("on"); closePop(); renderList();
  }

  /* ---------- picker ---------- */
  var pk = null;
  function closePop() { $("pop").hidden = true; pk = null; }
  function placePop(btn) {
    var p = $("pop"), r = btn.getBoundingClientRect(), w = 236;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    var top = r.bottom + 6; if (top + p.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - p.offsetHeight - 6);
    p.style.left = left + "px"; p.style.top = top + "px";
  }
  function openPicker(btn) {
    var field = btn.getAttribute("data-picker"), id = btn.getAttribute("data-id"), c = byId(id);
    pk = { field: field, id: id, btn: btn, pending: null };
    var p = $("pop");
    p.innerHTML = field === "resp" ? respPopHtml(c) : '<h4>Alterar ' + OPTS[field].label.toLowerCase() + '</h4>' + OPTS[field].list.map(function (o) {
      return '<button type="button" class="opt" data-val="' + o[0] + '"><span class="d" style="background:var(--' + o[1] + '-dot)"></span>' + o[0] + (c[field] === o[0] ? '<span class="ck">atual</span>' : "") + '</button>';
    }).join("");
    p.hidden = false; placePop(btn);
  }
  function askWhy(val) {
    var p = $("pop"); pk.pending = val;
    p.innerHTML = '<h4>' + OPTS[pk.field].label + ' → ' + val + '</h4><div class="why"><label for="why">Qual o motivo? (curto)</label><textarea id="why" placeholder="Ex.: cliente falou em cancelar"></textarea><div class="row-btns"><button type="button" class="btn" id="whyno">Voltar</button><button type="button" class="btn primary" id="whyok" disabled>Confirmar</button></div></div>';
    placePop(pk.btn); $("why").focus();
  }
  function applyChange(id, field, val, why) {
    var c = byId(id), old = c[field]; if (old === val) return;
    c[field] = val;
    c.hist.unshift({ when: new Date(), who: ME, text: "<b>" + OPTS[field].label + ":</b> " + old + " → " + val + (why ? ". Motivo: " + esc(why) : "") });
    renderList();
    if (openId === id) { $("strip").innerHTML = renderStrip(c); if (tab === "hist" || tab === "resumo") renderBody(); }
    toast(OPTS[field].label + " alterada para " + val);
  }

  function toggleResp(id, who) {
    var c = byId(id), old = c.resp.slice(), i = c.resp.indexOf(who);
    if (i > -1) { if (c.resp.length === 1) { toast("Precisa ter pelo menos um responsável"); return; } c.resp.splice(i, 1); } else c.resp.push(who);
    c.hist.unshift({ when: new Date(), who: ME, text: "<b>Responsável CS:</b> " + old.join(", ") + " → " + c.resp.join(", ") });
    renderList();
    $("pop").innerHTML = respPopHtml(c);
    if (openId === id) { $("strip").innerHTML = renderStrip(c); var s = $("dsub"); if (s) s.textContent = "ID " + c.id + " · " + c.seg + " · CS responsável: " + c.resp.join(", "); if (tab === "hist" || tab === "resumo") renderBody(); }
    toast("Responsáveis: " + c.resp.join(", "));
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    var pick = t.closest("[data-picker]");
    if (pick) { e.stopPropagation(); if (pk && pk.btn === pick && !$("pop").hidden) closePop(); else openPicker(pick); return; }
    var ropt = t.closest("[data-resp]");
    if (ropt && pk) { toggleResp(pk.id, ropt.getAttribute("data-resp")); return; }
    var opt = t.closest(".opt");
    if (opt && pk) {
      var v = opt.getAttribute("data-val");
      applyChange(pk.id, pk.field, v); closePop(); return;
    }
    if (t.closest("#pop")) return;
    if (!$("pop").hidden) closePop();
    var fc = t.closest("[data-filter]"); if (fc) { filter = fc.getAttribute("data-filter"); renderList(); return; }
    if (t.id === "close" || t.id === "scrim") { closeDrawer(); return; }
    var tb = t.closest("[data-tab]"); if (tb) { tab = tb.getAttribute("data-tab"); renderDrawer(); return; }
    var ty = t.closest("[data-type]"); if (ty) { draft.tipo = ty.getAttribute("data-type"); [].forEach.call(document.querySelectorAll("[data-type]"), function (b) { b.setAttribute("aria-pressed", b === ty); }); return; }
    var pn = t.closest("[data-pin]"); if (pn) { var c = byId(openId), nn = c.notes.filter(function (n) { return n.id == pn.getAttribute("data-pin"); })[0]; nn.pinned = !nn.pinned; renderBody(); toast(nn.pinned ? "Anotação fixada no topo" : "Anotação desafixada"); return; }
    if (t.id === "nsave") {
      var c2 = byId(openId), text = draft.text.trim(); if (!text) return;
      c2.notes.push(N(ME, new Date(), draft.tipo, text, false));
      if (draft.acao.trim()) { c2.acao = draft.acao.trim(); if (draft.prazo) { var p = draft.prazo.split("-"); c2.prazo = new Date(+p[0], +p[1] - 1, +p[2], 12); } }
      draft = { tipo: "Reunião ou ligação", text: "", acao: "", prazo: "" };
      renderDrawer(); renderList(); toast("Anotação salva. Último contato atualizado.");
      return;
    }
    var row = t.closest("[data-row]"); if (row) openDrawer(row.getAttribute("data-row"));
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "ntext") { draft.text = t.value; var b = $("nsave"); if (b) b.disabled = !t.value.trim(); }
    else if (t.id === "nacao") draft.acao = t.value;
    else if (t.id === "nprazo") draft.prazo = t.value;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (!$("pop").hidden) closePop(); else if (openId) closeDrawer(); }
    if (e.key === "Enter" && e.target.matches && e.target.matches("tr[data-row]")) openDrawer(e.target.getAttribute("data-row"));
  });
  window.addEventListener("resize", function () { if (pk) placePop(pk.btn); });

  renderList();
})();
</script>

</body>
</html>
